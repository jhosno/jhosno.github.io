<!DOCTYPE html>
<html lang="{{ page.lang | default: 'es' }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }} — jhosno</title>
  <meta name="description" content="{{ page.description }}" />
  <meta name="author" content="Jhosno Hernandez" />
  <meta name="theme-color" content="#1a1a1a" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />

  <!-- hreflang -->
  {% if page.lang == 'en' %}
  <link rel="alternate" hreflang="es" href="{{ page.url | remove_first: '/en' | absolute_url }}" />
  <link rel="alternate" hreflang="en" href="{{ page.url | absolute_url }}" />
  {% else %}
  <link rel="alternate" hreflang="en" href="{{ '/en' | append: page.url | absolute_url }}" />
  <link rel="alternate" hreflang="es" href="{{ page.url | absolute_url }}" />
  {% endif %}
  <link rel="alternate" hreflang="x-default" href="{{ page.url | remove_first: '/en' | absolute_url }}" />

  <!-- Open Graph -->
  <meta property="og:type" content="article" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:site_name" content="jhosno" />
  <meta property="og:title" content="{{ page.title }} — jhosno" />
  <meta property="og:description" content="{{ page.description }}" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Favicon -->
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Martian+Mono:wght@300;400;500&family=Instrument+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />

  <!-- Case CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/tokens.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/ribbon.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/case.css' | relative_url }}" />
</head>
<body>

<a class="skip" href="#case" data-i18n="skip">Skip to content</a>
<div class="grain" aria-hidden="true"></div>

<!-- Ribbon simplificado para caso -->
<header class="ribbon" id="ribbon" data-state="top">
  <div class="ribbon__bar">
    <a class="ribbon__mark" href="{{ '/' | relative_url }}">
      <span>jhosno</span>
    </a>
    <div class="ribbon__aside">
      <button class="lang" id="langBtn" type="button" aria-label="Cambiar a espanol">ES</button>
      <span class="ribbon__readout" id="readout">case</span>
      <a href="{{ '/#trabajo' | relative_url }}" style="text-decoration:none;opacity:.7">← all work</a>
    </div>
  </div>
  <div class="ribbon__rail"><i id="progress"></i></div>
</header>

<main id="case">
{{ content }}
</main>

<footer class="foot">
  <span>Jhosno Hernandez — 2018-2026</span>
  <span>handmade with html, css and js</span>
  <a href="{{ '/' | relative_url }}">jhosno.github.io</a>
</footer>

<!-- Case JS (minimal - just IntersectionObserver) -->
<script>
(function() {
  "use strict";
  var REDUCE = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // rise animations
  if ("IntersectionObserver" in window && !REDUCE) {
    var io = new IntersectionObserver(function(es) {
      es.forEach(function(e) {
        if (e.isIntersecting) { e.target.classList.add("on"); io.unobserve(e.target); }
      });
    }, { rootMargin: "0px 0px -12% 0px" });
    document.querySelectorAll(".rise").forEach(function(el) { io.observe(el); });
  } else {
    document.querySelectorAll(".rise").forEach(function(el) { el.classList.add("on"); });
  }

  // progress bar
  var riel = document.getElementById("progress");
  if (riel) {
    var pintarRiel = function() {
      var h = document.documentElement.scrollHeight - window.innerHeight;
      riel.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0).toFixed(2) + "%";
    };
    addEventListener("scroll", pintarRiel, { passive: true });
    addEventListener("resize", pintarRiel);
    pintarRiel();
  }

  // section reader
  var GLYPHS = "\u259A\u259E\u2588\u2593\u2592\u2591/\\|<>+*#@$%&=~^01";
  var readout = document.getElementById("readout");
  function scramble(el, final, ms) {
    if (REDUCE) { el.textContent = final; return; }
    var t0 = performance.now(), chars = final.split("");
    (function paso(t) {
      var p = Math.min(1, (t - t0) / (ms || 460));
      var rev = Math.floor(p * chars.length), out = "";
      for (var i = 0; i < chars.length; i++) {
        out += (i < rev || chars[i] === " ") ? chars[i] : GLYPHS[(Math.random() * GLYPHS.length) | 0];
      }
      el.textContent = out;
      if (p < 1) requestAnimationFrame(paso); else el.textContent = final;
    })(t0);
  }

  var bands = [].slice.call(document.querySelectorAll(".band span"));
  var actual = "";
  if ("IntersectionObserver" in window) {
    var io2 = new IntersectionObserver(function(es) {
      es.forEach(function(e) {
        if (!e.isIntersecting) return;
        var txt = e.target.textContent.trim().toLowerCase();
        if (txt !== actual) { actual = txt; scramble(readout, txt); }
      });
    }, { rootMargin: "-45% 0px -45% 0px" });
    bands.forEach(function(el) { io2.observe(el); });
  }

  // language toggle
  var langBtn = document.getElementById("langBtn");
  var isEN = window.location.pathname.indexOf("/en/") !== -1;
  if (langBtn) {
    langBtn.textContent = isEN ? "ES" : "EN";
    langBtn.addEventListener("click", function() {
      if (isEN) {
        window.location.href = window.location.pathname.replace(/^\/en\//, "/").replace(/^\/en$/, "/") + window.location.search;
      } else {
        window.location.href = "/en" + window.location.pathname + window.location.search;
      }
    });
  }
})();
</script>

</body>
</html>
