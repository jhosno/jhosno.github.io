{% assign t = site.data.translations[page.lang] %}
<!DOCTYPE html>
<html lang="{{ page.lang | default: 'es' }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }} — jhosno</title>
  <meta name="description" content="{{ page.description | default: 'Full-stack developer and art director. WordPress, Laravel, brand identity. White-label for agencies. Bogota, GMT-5.' }}" />
  <meta name="author" content="Jhosno Hernandez" />
  <meta name="theme-color" content="#1a1a1a" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />

  <!-- hreflang -->
  {% if page.lang == 'en' %}
  <link rel="alternate" hreflang="es" href="{{ page.url | remove_first: '/en' | absolute_url }}" />
  <link rel="alternate" hreflang="en" href="{{ page.url | absolute_url }}" />
  {% else %}
  <link rel="alternate" hreflang="en" href="{{ '/en' | append: page.url | absolute_url }}" />
  <link rel="alternate" hreflang="es" href="{{ page.url | absolute_url }}" />
  {% endif %}
  <link rel="alternate" hreflang="x-default" href="{{ page.url | remove_first: '/en' | absolute_url }}" />

  <!-- Open Graph -->
  <meta property="og:type" content="profile" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:site_name" content="jhosno" />
  <meta property="og:title" content="{{ page.title }} — jhosno" />
  <meta property="og:description" content="{{ page.description | default: 'Full-stack developer and art director. WordPress, Laravel, brand identity.' }}" />
  <meta property="og:image" content="{{ '/assets/images/og.png' | absolute_url }}" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Favicon -->
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Martian+Mono:wght@200;300;400;500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

  <!-- New portfolio CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/tokens.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/ribbon.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/marquee.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/hero.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/sections.css' | relative_url }}" />

  <!-- Legacy CSS (for posts/projects) -->
  <link rel="stylesheet" href="{{ '/assets/css/output.css' | relative_url }}" />
</head>
<body>

<a class="skip" href="#quien">{{ t.home.skip }}</a>
<div class="bugcur" id="bugcur" aria-hidden="true">\#/</div>
<div class="grain" aria-hidden="true"></div>

{{ content }}

<!-- New portfolio JS -->
<script src="{{ '/assets/js/seed.js' | relative_url }}"></script>
<script src="{{ '/assets/js/marquee.js' | relative_url }}"></script>
<script src="{{ '/assets/js/ribbon.js' | relative_url }}"></script>
<script src="{{ '/assets/js/hero.js' | relative_url }}"></script>
<script src="{{ '/assets/js/lang.js' | relative_url }}"></script>

</body>
</html>
