# Work cards — edit here to add, remove or reorder projects.
# Each card generates a <article class="card"> in the work section.

# --- Card 0: Two papers (double) ---
- type: double
  i18n: c0
  pattern: card--doble
  idx: "wordpress · web design · 2026"
  title: "Two papers"
  desc: "Same agency, weeks apart. The same Elementor. Two identities with nothing in common — on purpose. The \"before\" of each one is on archive.org."
  log:
    - dt: lBrief
      dt_label: brief
      dd: "Login details and two adjectives: \"modern and pretty\". No web design, no guide, no design."
      key: c0a
    - dt: c0bt
      dt_label: "call · dover"
      dd: "The voice was already paranoid parody. So direct it straight: the more convinced the design, the funnier the text."
      key: c0b
    - dt: c0ct
      dt_label: "call · clute"
      dd: "No color to inherit. Teal instead of every newspaper's navy, and far from Dover on purpose: two clients of one agency cannot converge."
      key: c0c
    - dt: lShip
      dt_label: shipped
      dd: "Identity, visual system and the site running. Twice, without repeating a single decision."
      key: c0e
  images:
    - src: img/dover.png
      alt_key: altDover
      alt: "The Dover Street Examiner: heavy grotesque headline with chromatic glitch over a night photograph."
      name: "The Dover Street Examiner"
      before: "https://web.archive.org/web/20260307115301/https://www.doverstreet.org/"
      before_title_key: tDover
      live: "https://www.doverstreet.org"
    - src: img/clute.png
      alt_key: altClute
      alt: "Clute Institute: high-contrast serif headline over a teal polygonal texture."
      name: "Clute Institute"
      before: "https://web.archive.org/web/20260208090953/https://www.cluteinstitute-onlinejournals.com/"
      before_title_key: tClute
      live: "https://www.cluteinstitute-onlinejournals.com"
  tags:
    - label: wordpress
    - key: tgBrand
      label: "web design"
    - key: tgArt
      label: "web design"
    - label: elementor

# --- Card 1: Amanda Escalona ---
- type: single
  i18n: cA
  pattern: p7
  idx: "web design · 2025"
  title: "Amanda Escalona"
  desc: "Portfolio update for a copywriter and content strategist. New identity, no prior design concept — just the need to look like what she already is."
  log:
    - dt: lSym
      dt_label: symptom
      dd: "A 2020 Jekyll site with default theme and no visual identity."
      key: cAa
    - dt: lCatch
      dt_label: catch
      dd: "Full redesign: custom CSS, typographic system, dark palette, bilingual structure."
      key: cAb
    - dt: lOut
      dt_label: outcome
      dd: "A site that finally matches the work — live at amandaescalona.github.io."
      key: cAc
  images:
    - src: img/AE.png
      alt: "Amanda Escalona: copywriter and content strategist portfolio with dark palette and typographic system."
      name: "Amanda Escalona"
      before: "https://web.archive.org/web/20200909113858/https://amandaescalona.github.io/"
      live: "https://amandaescalona.github.io/"
  tags:
    - label: html
    - label: css
    - label: jekyll
    - key: tgBrand
      label: "web design"

