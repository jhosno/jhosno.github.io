# --- Card 2: Creatienda ---
- pattern: p1
  i18n: c2
  title: Creatienda
  idx: "product · laravel · 2024 — now"
  desc: "Multi-tenant e-commerce SaaS for LATAM small businesses. Critical modules in production, many stores on one codebase."
  log:
