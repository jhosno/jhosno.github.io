<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Performance: speedometer -->
  <rect width="400" height="300" fill="#1a1a1a"/>
  <!-- Arc background -->
  <path d="M 80 220 A 120 120 0 0 1 320 220" fill="none" stroke="#7d2764" stroke-width="20" stroke-linecap="round"/>
  <!-- Arc filled -->
  <path d="M 80 220 A 120 120 0 0 1 280 120" fill="none" stroke="#B9BE2A" stroke-width="20" stroke-linecap="round"/>
  <!-- Needle -->
  <line x1="200" y1="220" x2="260" y2="140" stroke="#C53A9D" stroke-width="3" stroke-linecap="round"/>
  <!-- Center circle -->
  <circle cx="200" cy="220" r="8" fill="#C53A9D"/>
  <!-- Label -->
  <text x="200" y="260" fill="#f2f0d8" font-family="monospace" font-size="12" text-anchor="middle">PERFORMANCE</text>
</svg>
