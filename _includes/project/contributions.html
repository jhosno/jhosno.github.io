 <!-- My Contribution Section -->
 <section class="py-20 px-6 pixel-grid relative">
    <!-- Background decorations -->
    <div class="absolute top-20 left-10 w-12 h-12 bg-salmon/10 pixel-art float-animation"></div>
    <div class="absolute bottom-20 right-10 w-16 h-16 bg-purple/10 pixel-art float-animation" style="animation-delay: 1s;"></div>

    <div class="container mx-auto max-w-5xl relative z-10">
        <div class="text-center mb-12">
            <h2 class="text-3xl md:text-4xl font-black mb-4 glitch">
                <span class="text-salmon">MI ROL COMO</span>
            </h2>
            <h3 class="text-2xl md:text-3xl font-black text-golden">{{page.my_contribution.title}}</h3>
            <div class="flex justify-center mt-4 gap-2">
                <div class="w-3 h-3 bg-salmon pixel-art"></div>
                <div class="w-3 h-3 bg-purple pixel-art" style="animation-delay: 0.2s;"></div>
                <div class="w-3 h-3 bg-golden pixel-art" style="animation-delay: 0.4s;"></div>
            </div>
        </div>

        <!-- Intro -->
        <div class="bg-gray-900/80 border-4 border-salmon p-6 md:p-8 relative overflow-hidden">
            <!-- Corner decorations -->
            <div class="absolute top-2 left-2 w-4 h-4 bg-salmon"></div>
            <div class="absolute top-2 right-2 w-4 h-4 bg-salmon"></div>
            <div class="absolute bottom-2 left-2 w-4 h-4 bg-salmon"></div>
            <div class="absolute bottom-2 right-2 w-4 h-4 bg-salmon"></div>
            
            <div class="flex items-start gap-6">
                <div class="hidden md:block flex-shrink-0">
                    <div class="w-20 h-20 bg-gradient-to-br from-salmon via-purple to-golden flex items-center justify-center text-3xl border-4 border-white pixel-art">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                        </svg>
                    </div>
                </div>
                <div>
                    <p class="text-lg md:text-xl text-gray-300 leading-relaxed">
                        {{page.my_contribution.content}}
                    </p>
                </div>
            </div>
        </div>

    </div>
 </section>
