<!-- STATE — seccion de estado (reutilizable x4) -->
<div class="band {{ include.band-class }}">
  <span>{{ include.band-title }}</span>
  <small>{{ include.band-sub }}</small>
</div>
<div class="wrap"><section class="state">
  <div class="state__grid">
    <div class="prose rise">
      {{ include.content }}
    </div>

    {% if include.figure-class %}
    <figure class="fig rise">
      <div class="fig__box {{ include.figure-class }}"><i></i></div>
      {% if include.figcaption %}<figcaption>{{ include.figcaption }}</figcaption>{% endif %}
    </figure>
    {% endif %}
  </div>
</section></div>
