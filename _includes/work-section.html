<!-- WORK SECTION — carrusel horizontal de proyectos -->
<div class="band band--acid" data-marquee data-speed="90" data-dir="-1" data-velocity>
  <div class="marquee">
    <div class="marquee__track">
      <div class="marquee__group">
        <span data-i18n="b2a">02 · work <i class="dot">✳</i></span><span data-i18n="b2b">wordpress + product <i class="dot">✳</i></span>
        <span>2018 — 2026 <i class="dot">✳</i></span>
      </div>
    </div>
  </div>
</div>

<section class="sec work" id="trabajo">
  <div class="work__vp">
    <div class="work__track" id="workTrack">
      {% for item in site.data.work %}
        {% include card.html item=item %}
      {% endfor %}
    </div>
  </div>
</section>
