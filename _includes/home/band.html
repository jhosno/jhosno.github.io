<!-- BAND — cinta marquee divisoria -->
<div class="band" data-marquee data-speed="72" data-velocity>
  <div class="marquee">
    <div class="marquee__track">
      <div class="marquee__group">
        <span>{{ t.home.read }} <i class="dot">+</i></span>
        <span>{{ t.home.direct }} <i class="dot">+</i></span>
        <span>{{ t.home.refactor }} <i class="dot">+</i></span>
        <span>{{ t.home.ship }} <i class="dot">+</i></span>
      </div>
    </div>
  </div>
</div>
