<!-- WORK-CARD — ficha individual de proyecto -->
<article class="card {{ include.class }}">
  <div class="card__vis"><i class="{{ include.pattern }}"></i></div>
  <div class="card__body">
    <span class="card__idx">{{ include.idx }}</span>
    <h3 class="card__title">{{ include.title }}</h3>
    <p class="card__desc">{{ include.desc }}</p>
    <div class="card__tags">
      {% assign tags = include.tags | split: "," %}
      {% for tag in tags %}
      <span>{{ tag }}</span>
      {% endfor %}
    </div>
  </div>
</article>
